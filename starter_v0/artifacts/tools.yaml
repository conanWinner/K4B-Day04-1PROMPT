# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  # v1 change: clarify is the required control tool for missing or ambiguous input.
  - name: clarify
    # v2 change: include explicit approval of the current write payload.
    # v3.2 change: cover requests whose intended capability is not yet clear.
    description: "Bắt buộc dùng khi chưa đủ thông tin để xác định ý định hoặc chọn công cụ, khi thiếu thông tin cần thiết, tham số mơ hồ hoặc cần xác nhận hành động ghi dữ liệu. Khi user yêu cầu tạo ticket và đã nêu sự cố, mức ưu tiên và/hoặc mã máy, đó đã là payload đủ: dùng response_type=yes_no, đưa payload vào question; không dùng text để hỏi lại tóm tắt. Không thay thế bằng câu hỏi chỉ viết trong final response."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        # v2 change: distinguish missing information from action confirmation.
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text để bổ sung thông tin còn thiếu; yes_no để xác nhận payload hành động hiện tại; choice để chọn giữa các giá trị hợp lệ."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật trong knowledge base nội bộ. Khi chủ đề rõ (Outlook/email, Wi-Fi, VPN, printing, account) bắt buộc set category đúng enum. Không bỏ category và không để all nếu đã khớp một nhóm."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  # v1 change: distinguish shared service status from a single-device inspection.
  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ hạ tầng dùng chung như VPN, email, SSO, Wi-Fi hoặc printing. Không dùng để chẩn đoán một thiết bị cá nhân. environment chỉ nhận production hoặc staging. Tên demo, QA, test, sandbox phải clarify với response_type=choice và options [production, staging]; không map demo thành staging."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  # v1 change: require an explicit asset ID instead of guessing one.
  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán một thiết bị cụ thể theo Asset ID đã nêu (ví dụ hình dạng LT-204). Cấm tự bịa mã. 'laptop của mình' không phải Asset ID — phải clarify. Không nhận Employee ID. Snapshot tổng thể: set check=all (không bỏ trống). Nếu user nêu vpn/network/security/hardware/software thì set check đúng nhóm đó."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  # v1 change: require an explicit employee ID instead of guessing one.
  - name: lookup_user
    description: "Tra cứu một người dùng cụ thể bằng Employee ID (EMP-xxxx), gồm cả danh sách thiết bị được cấp. Câu hỏi về tài khoản và thiết bị được cấp chỉ cần tool này. Không gọi thêm inspect_device trừ khi user đưa một Asset ID riêng. Không truyền EMP-xxxx vào inspect_device. Nếu thiếu Employee ID thì dùng clarify."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    # v3 change: external search accepts only public product information.
    description: "Gửi truy vấn ra dịch vụ tìm kiếm bên ngoài để tìm thông tin sản phẩm công khai. Chỉ truyền hãng, tên model công khai, loại truy vấn và giới hạn kết quả. Không đưa Asset ID, Employee ID, serial, hostname, vị trí nội bộ, diagnostics hoặc bí mật vào bất kỳ tham số nào. Tách bỏ dữ liệu nội bộ; nếu không xác định chắc hãng/model công khai thì dùng clarify."
    parameters:
      type: object
      properties:
        # v3 change: free-text fields must not carry internal identifiers or secrets.
        manufacturer: {type: string, description: "Chỉ tên hãng sản xuất công khai, ví dụ Lenovo; không ghép dữ liệu nội bộ hoặc chỉ dẫn vào đây."}
        model: {type: string, description: "Chỉ tên dòng sản phẩm công khai, ví dụ ThinkPad T14 Gen 4; không kèm Asset ID, Employee ID, serial, hostname, diagnostics hoặc bí mật."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    # v2 change: a write requires explicit confirmation of the unchanged payload.
    description: "Tạo ticket hỗ trợ và ghi file cục bộ. Chỉ gọi khi người dùng đã xác nhận rõ ràng nội dung ticket hiện tại. Yêu cầu tạo, xem lại hoặc sửa ticket không phải xác nhận. Nếu user đã nêu sự cố, priority và asset thì clarify với response_type=yes_no (không dùng text để hỏi lại summary). Nếu chưa xác nhận hoặc nội dung đã thay đổi, gọi clarify yes_no trước và chờ người dùng trả lời."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        # v2 change: the model must not invent or reuse stale confirmation.
        confirmed: {type: boolean, default: false, description: "Chỉ true khi người dùng đã xác nhận rõ ràng đúng summary, priority và asset_id hiện tại. Mọi thay đổi nội dung làm xác nhận cũ mất hiệu lực; không tự suy diễn true."}
      required: [summary]
