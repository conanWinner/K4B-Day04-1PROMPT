# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    # Cũ: description: "Gửi một câu hỏi cho người dùng."
    description: "Gửi một câu hỏi cho người dùng. BẮT BUỘC dùng tool này để hỏi ID còn thiếu (response_type='text'), hỏi xác nhận (response_type='yes_no'), hoặc hỏi lựa chọn (response_type='choice')."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    # Cũ: description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật. KHÔNG để category là 'all' nếu ngữ cảnh đã rõ ràng (ví dụ: Outlook -> email, mạng -> wifi)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    # Cũ: description: "Kiểm tra trạng thái một dịch vụ."
    description: "Kiểm tra trạng thái chung của một dịch vụ hệ thống (VD: VPN, email toàn công ty). KHÔNG dùng tool này để kiểm tra lỗi trên một thiết bị cụ thể. LƯU Ý: Nếu người dùng yêu cầu môi trường lạ (VD: 'demo', 'test') không thuộc [production, staging], BẮT BUỘC gọi tool clarify(response_type='choice', options=['production', 'staging']) để hỏi lại, tuyệt đối KHÔNG ĐƯỢC tự động chọn hay dùng giá trị mặc định."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    # Cũ: description: "Kiểm tra thông tin và chẩn đoán thiết bị."
    description: "Kiểm tra thông tin và chẩn đoán trên MỘT thiết bị cụ thể. Yêu cầu mã asset_id chính xác (VD: LT-204). LƯU Ý: Nếu ngữ cảnh nhắc đến một vấn đề cụ thể (như VPN, wifi, mạng), hãy đặt tham số `check` tương ứng (VD: 'vpn', 'network') thay vì dùng 'all'."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    # Cũ: description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    description: "Tra cứu người dùng. Tool này tự động trả về thông tin tài khoản LẪN danh sách thiết bị được cấp (assigned assets). Không cần gọi thêm inspect_device nếu chỉ muốn xem danh sách thiết bị."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    # Cũ: description: "Trình bày các kết quả đã có thành báo cáo."
    description: "Chỉ định dạng/trình bày các kết quả ĐÃ CÓ sẵn thành báo cáo. KHÔNG gọi tool này để tìm kiếm thêm thông tin."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    # Cũ: description: "Tìm trong chính sách IT nội bộ."
    description: "Tìm trong chính sách IT nội bộ. BẮT BUỘC chọn `policy_area` phù hợp với nội dung tìm kiếm thay vì dùng 'all'."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    # Cũ: description: "Tạo một ticket hỗ trợ."
    description: "Tạo một ticket hỗ trợ. Phải gọi clarify(response_type='yes_no') để hỏi ý kiến người dùng trước khi gọi tool này với confirmed=true."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
