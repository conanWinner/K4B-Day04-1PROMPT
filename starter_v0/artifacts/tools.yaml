tools:
  # ---------------- Core tools ----------------
  # v1 change: clarify is the required control tool for missing or ambiguous input.
  - name: clarify
    description: "Gửi câu hỏi để THU THẬP THÔNG TIN THIẾU (như mã asset_id cụ thể, employee_id cụ thể, môi trường) hoặc XÁC NHẬN tạo ticket. TUYỆT ĐỐI KHÔNG tự ý gọi tool này để đề nghị hỗ trợ/tạo ticket khi người dùng chưa yêu cầu, hoặc hỏi xác nhận lại khi thông tin đã rõ ràng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi hoặc thông tin cần xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Dùng 'yes_no' cho bước chốt xác nhận tạo ticket, 'choice' khi đưa danh sách lựa chọn môi trường/thiết bị"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn nếu response_type là choice"}
      required: [question, response_type]

  - name: search_kb
    description: "Tra cứu bài viết hướng dẫn kỹ thuật, quy trình xử lý sự cố (Wi-Fi, VPN, phần cứng) và các quy định/chính sách kỹ thuật liên quan đến tài khoản, đổi mật khẩu, quản lý tài khoản IT."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm danh mục hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  # v1 change: distinguish shared service status from a single-device inspection.
  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động thực tế của một dịch vụ IT (VPN, Email, SSO...). KHÔNG gọi tool này nếu người dùng chưa chỉ rõ môi trường (production hay staging)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ cần kiểm tra"}
        environment: {type: string, enum: [production, staging], description: "Môi trường cần kiểm tra (bắt buộc người dùng phải xác định rõ ràng, không tự ý chọn mặc định)"}
      required: [service, environment]

  # v1 change: require an explicit asset ID instead of guessing one.
  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết, chẩn đoán phần cứng, mạng, bảo mật trên một thiết bị cụ thể qua mã tài sản (asset_id). Phải ánh xạ đúng tham số check: RAM/CPU -> hardware, IP/Wi-Fi -> network, virus/chứng chỉ -> security, VPN -> vpn, tổng thể -> all."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản thiết bị cụ thể (ví dụ: PC-502, LT-108, LT-204)"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Hạng mục cần chẩn đoán. Bắt buộc chọn đúng hạng mục người dùng yêu cầu, không chọn 'all' nếu người dùng chỉ đề cập riêng một tính năng (vd: VPN, Wi-Fi)."}
      required: [asset_id]

  # v1 change: require an explicit employee ID instead of guessing one.
  - name: lookup_user
    description: "Tra cứu thông tin chi tiết của người dùng trong danh bạ công ty. CHỈ gọi khi người dùng cung cấp chính xác MÃ NHÂN VIÊN dạng EMP-xxx (ví dụ: EMP-123). KHÔNG truyền tên phòng ban (như 'Sales'), tên riêng hoặc từ chung chung vào tham số employee_id."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên định dạng EMP-xxx (ví dụ: EMP-123, EMP-1003)"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả chẩn đoán/tra cứu đã thu thập thành báo cáo sự cố hoàn chỉnh."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các kết quả đã thu thập được"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm kiếm thông tin công khai trên Internet về một model thiết bị (specs, driver). Tuyệt đối không truyền mã tài sản nội bộ (asset ID) hay dữ liệu cá nhân vào đây."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất (ví dụ: Lenovo, Dell)"}
        model: {type: string, description: "Tên model công khai (ví dụ: ThinkPad T14 Gen 4)"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Mục đích tìm kiếm"}
        max_results: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tra cứu các quy định, chính sách chung cấp công ty về hành chính, nhân sự, quy trình bàn giao/cấp phát tài sản chung. KHÔNG dùng cho quy định/chính sách đổi mật khẩu hay tài khoản IT."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung quy định cần tra cứu"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Lĩnh vực chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục kết quả"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ kỹ thuật trên hệ thống. CẢNH BÁO: Đây là thao tác ghi, CHỈ ĐƯỢC GỌI sau khi người dùng đã nhấn/trả lời XÁC NHẬN ĐỒNG Ý (yes) từ câu hỏi clarify trước đó."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt ngắn gọn nội dung sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức độ ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản liên quan (nếu có)"}
        confirmed: {type: boolean, description: "Bắt buộc phải là true khi thực hiện tạo ticket"}
      required: [summary, confirmed]
